<header>
  <div class="wrap">
    <a class="logo" href="#top" aria-label="BP home"><span class="mark">BP</span></a>
    <nav aria-label="Tools" id="tools">
      <button data-mode="word" class="active">Word to PDF</button>
      <button data-mode="pdf2word">PDF to Word</button>
      <button data-mode="editor">Edit PDF</button>
      <button data-mode="merge">Merge PDF</button>
      <button data-mode="split">Split PDF</button>
      <div class="more">
        <button id="moreBtn" aria-haspopup="true" aria-expanded="false">More tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu" id="menu">
          <button data-mode="compress">Compress PDF</button>
          <button data-mode="protect">Protect PDF</button>
          <button data-mode="unlock">Unlock PDF</button>
          <button data-mode="rotate">Rotate PDF</button>
          <button data-mode="watermark">Watermark PDF</button>
        </div>
      </div>
    </nav>
    <button class="icon-btn" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg><use href="#i-moon"/></svg></button>
  </div>
</header>
